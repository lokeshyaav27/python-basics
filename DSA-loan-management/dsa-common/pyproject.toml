[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-common"
version = "1.0.0"
description = "Shared core domain models, constants, repositories, and calculation engines for DSA Loan Management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsa_common*"]
